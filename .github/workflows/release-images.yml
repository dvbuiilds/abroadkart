# Release gate and image publishing. Runs when a version tag (v*) is pushed.
#
# 1. verify: the same checks as the release gate in DEPLOY.md (root and Keystone tests).
# 2. images: builds the web and Keystone images for linux/amd64 and pushes them to GHCR,
#    tagged with the git tag. The droplet pulls these tags and never builds.
#
# After the first publish, make each package public in GitHub (Packages → package
# settings → Change visibility) so the droplet can pull without logging in.
#
# Bump `node-version` together with the `FROM node:` lines in Dockerfile and keystone/Dockerfile.

name: release-images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            keystone/yarn.lock

      - name: Root tests (typecheck, lint, unit)
        run: |
          yarn install --frozen-lockfile
          yarn test

      - name: Keystone typecheck and tests
        working-directory: keystone
        run: |
          yarn install --frozen-lockfile
          npx tsc --noEmit
          yarn test

  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        image:
          - name: abroadkart-web
            context: .
            file: Dockerfile
          - name: abroadkart-keystone
            context: keystone
            file: keystone/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dvbuiilds/${{ matrix.image.name }}
          tags: |
            type=ref,event=tag
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max
